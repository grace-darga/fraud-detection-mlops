version: "3.8"

services:
  # ─── API de prédiction ───────────────────────────────────────────────────
  api:
    build: .
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app
    depends_on:
      - mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Serveur MLflow ──────────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: fraud-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - mlflow-db:/mlflow
    command: >
     bash -c "pip install mlflow==2.9.2 &&
     mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000"
    restart: unless-stopped

volumes:
  mlflow-db:

networks:
  default:
    name: fraud-detection-network
