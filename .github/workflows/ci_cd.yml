name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  MIN_ROC_AUC: 0.95
  MIN_F1: 0.80

jobs:
  # ── 1. Tests & Linting ────────────────────────────────────────────────────
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint avec flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503,F401,E305,W292,E702,E302,W293,W291,E303,E231,E225,W391

      - name: Run tests avec pytest
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── 2. Entraînement & Évaluation du modèle ───────────────────────────────
  train:
    name: Train & Evaluate Model
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup DVC avec Google Drive
        run: |
          dvc remote add -d myremote gdrive://${{ secrets.GDRIVE_FOLDER_ID }}
          dvc remote modify myremote gdrive_use_service_account true
          dvc remote modify myremote gdrive_service_account_json_file_path credentials.json
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > credentials.json

      - name: Pull des données depuis DVC
        run: dvc pull

      - name: Reproduire le pipeline DVC
        run: dvc repro

      - name: Vérifier les seuils de performance
        run: |
          python -c "
          import json
          with open('metrics/scores.json') as f:
              m = json.load(f)
          print('Métriques obtenues:', m)
          assert m['roc_auc'] > ${{ env.MIN_ROC_AUC }}, f'ROC-AUC trop bas: {m[\"roc_auc\"]}'
          assert m['f1'] > ${{ env.MIN_F1 }}, f'F1 trop bas: {m[\"f1\"]}'
          print('Seuils de qualite valides')
          "

      - name: Push métriques vers DVC
        run: dvc push

      - name: Sauvegarder les artefacts
        uses: actions/upload-artifact@v3
        with:
          name: model-artifacts
          path: |
            models/model.pkl
            metrics/scores.json

  # ── 3. Build & Deploy Docker ──────────────────────────────────────────────
  deploy:
    name: Build & Deploy Docker
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Télécharger les artefacts du modèle
        uses: actions/download-artifact@v3
        with:
          name: model-artifacts

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection:${{ github.sha }}

      - name: Notifier le succès
        run: |
          echo "Déploiement terminé avec succès"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection:latest"
